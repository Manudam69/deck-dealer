@if (card(); as card) {
  <div
    class="relative aspect-[3/4] overflow-hidden rounded-2xl border-2 border-card-border shadow-md"
    [class.bg-cream-dark]="imageError()"
    [class.bg-card-surface]="!imageError()"
    [class.w-12]="size() === 'sm'"
    [class.shrink-0]="size() === 'sm'"
    [class.w-[min(70vw,18rem)]]="size() === 'lg'"
    [class.max-h-[70vh]]="size() === 'lg'"
  >
    @if (imageError()) {
      <div class="absolute inset-0 flex flex-col items-center justify-center gap-2 p-4 text-center" aria-hidden="true">
        <span class="absolute left-2 top-2 rounded-full border border-card-border bg-cream px-2 py-1 text-xs font-bold text-mexican-pink">
          #{{ card.number }}
        </span>
        <span class="font-heading text-xl font-semibold leading-tight text-ink">{{ card.name }}</span>
      </div>
    } @else {
      <img
        [ngSrc]="card.image"
        fill
        [priority]="size() === 'lg'"
        [sizes]="size() === 'lg' ? '100vw' : '48px'"
        [alt]="card.name"
        (error)="imageError.set(true)"
        class="h-full w-full object-contain"
      />
    }
  </div>
}
