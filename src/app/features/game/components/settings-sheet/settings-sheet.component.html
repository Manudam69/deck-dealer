@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-end justify-center bg-ink/40 p-0"
    (click)="close.emit()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="settings-title"
  >
    <div
      #sheet
      class="w-full max-w-[28rem] max-h-[80vh] overflow-y-auto rounded-t-3xl bg-cream shadow-[0_-10px_25px_-5px_rgb(0,0,0,0.1)] outline-none animate-slide-up"
      (click)="$event.stopPropagation()"
      (keydown)="onKeydown($event)"
      tabindex="-1"
    >
      <div class="flex items-center justify-between border-b border-card-border px-5 py-4">
        <h2 id="settings-title" class="m-0 font-heading text-2xl font-bold text-ink">Ajustes</h2>
        <app-icon-button icon="x" label="Cerrar ajustes" (clicked)="close.emit()" />
      </div>

      <div class="flex flex-col gap-6 p-5">
        <fieldset class="m-0 flex flex-col gap-3 border-0 p-0">
          <legend class="m-0 font-heading text-base font-bold text-ink">Baraja</legend>
          @for (deck of decks(); track deck.id) {
            <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-card-border bg-card-surface p-3 transition-colors hover:bg-cream-dark">
              <input
                type="radio"
                name="deck"
                class="size-5 shrink-0 accent-mexican-pink"
                [value]="deck.id"
                [checked]="settings.settings().deckId === deck.id"
                (change)="selectDeck(deck.id)"
              />
              <span class="font-semibold text-ink">{{ deck.name }}</span>
            </label>
          }
        </fieldset>

        <div class="flex flex-col gap-3">
          <label class="m-0 font-heading text-base font-bold text-ink" for="speed">Velocidad automática: {{ speedSeconds() }}s</label>
          <input
            id="speed"
            type="range"
            class="w-full cursor-pointer accent-mexican-pink"
            [min]="minSpeedMs"
            [max]="maxSpeedMs"
            [step]="stepMs"
            [value]="settings.settings().speedMs"
            (input)="updateSpeed($event)"
          />
          <div class="flex justify-between text-sm text-ink-muted">
            <span>Rápido</span>
            <span>Lento</span>
          </div>
        </div>

        <div class="flex flex-col gap-3">
          <button
            type="button"
            class="flex w-full items-center justify-between rounded-xl border border-card-border bg-card-surface px-4 py-3.5 text-ink transition-colors hover:bg-cream-dark"
            [class.bg-cream-dark]="false"
            (click)="toggleVoice()"
            [attr.aria-pressed]="settings.settings().voiceEnabled"
          >
            <span class="font-semibold">Anunciar cartas en voz alta</span>
            <span
              class="relative h-6 w-11 rounded-full transition-colors"
              [class.bg-mexican-pink]="settings.settings().voiceEnabled"
              [class.bg-ink-muted]="!settings.settings().voiceEnabled"
              aria-hidden="true"
            >
              <span
                class="absolute left-0.5 top-0.5 size-5 rounded-full bg-white transition-transform"
                [class.translate-x-5]="settings.settings().voiceEnabled"
              ></span>
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>
}
